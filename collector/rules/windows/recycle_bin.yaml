id: win.recycle_bin
name: Windows Recycle Bin Metadata & Data
description: Deleted file metadata index files ($I) and recovered contents ($R) stored in the volume Recycle Bin.
category: FileDeletion
os: windows
targets:
  - path: '$Recycle.Bin'
    mask: '$I*'
    recursive: true
    comment: Deleted item index records
  - path: '$Recycle.Bin'
    mask: '$R*'
    recursive: true
    comment: Deleted item recovered contents
