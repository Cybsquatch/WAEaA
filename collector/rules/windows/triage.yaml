id: triage
name: Standard Triage Collection
description: Comprehensive standard incident response triage package collecting logs, registry, execution, tasks, command history, and shortcuts.
category: Compound
os: windows
compound: true
rules:
  - win.eventlogs
  - win.registry
  - win.prefetch
  - win.amcache
  - win.srum
  - win.lnk_jumplists
  - win.scheduled_tasks
  - win.powershell_history
  - win.recycle_bin
  - win.browser_history
