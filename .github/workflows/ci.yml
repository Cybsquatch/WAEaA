name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- collector
  collector:
    name: collector (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        go: ["stable", "1.20.14"]   # modern build + Windows 7 legacy build
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: collector
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: collector/go.sum
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (Linux with race detector)
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -race ./...
      - name: test (standard)
        if: matrix.os != 'ubuntu-latest' || matrix.go != 'stable'
        run: go test -v ./...
      - name: build
        run: go build -trimpath -o bin/waeaa${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/waeaa

  # ----------------------------------------------------------------- ingestor
  ingestor:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: ingestor
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb1 libx11-xcb1
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest --cov=waeaa_ingestor --cov-report=term-missing
